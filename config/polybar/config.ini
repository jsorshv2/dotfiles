[colors]
base = #1e1e2e
mantle = #181825
crust = #11111b
text = #cdd6f4
subtext0 = #a6adc8
subtext1 = #bac2de
surface0 = #313244
surface1 = #45475a
surface2 = #585b70
overlay0 = #6c7086

mauve = #cba6f7
pink = #f5c2e7
red = #f38ba8
peach = #fab387
yellow = #f9e2af
green = #a6e3a1
teal = #94e2d5
blue = #89b4fa
lavender = #b4bfe2

[bar/main]
width = 100%
height = 28pt
radius = 0

background = ${colors.base}
foreground = ${colors.text}

line-size = 2pt

padding-left = 1
padding-right = 1

module-margin = 1

font-0 = "JetBrainsMono Nerd Font:size=10;2"

modules-left = i3 xwindow
modules-center = date
modules-right = cpu memory pulseaudio

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/i3]
type = internal/i3
show-urgent = true
index-sort = true
focused-label-font = 1

label-focused = %index%
label-focused-background = ${colors.surface0}
label-focused-foreground = ${colors.mauve}
label-focused-underline = ${colors.mauve}
label-focused-padding = 1

label-unfocused = %index%
label-unfocused-foreground = ${colors.subtext0}
label-unfocused-padding = 1

label-visible = %index%
label-visible-padding = 1

label-urgent = %index%
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.crust}
label-urgent-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:30:...%
label-foreground = ${colors.subtext0}

[module/date]
type = internal/date
interval = 1

date = %Y-%m-%d %H:%M
date-alt = %A, %B %d, %Y %H:%M:%S

label = %date%
label-foreground = ${colors.teal}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.peach}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.green}
label = %percentage_used:2%%

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "󰕾 "
format-volume-prefix-foreground = ${colors.blue}
format-volume = <label-volume>
label-volume = %percentage%%

label-muted = "󰝟 muted"
label-muted-foreground = ${colors.overlay0}
